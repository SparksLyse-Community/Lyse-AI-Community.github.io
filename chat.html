<!doctype html>
<html lang="fr-FR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat — Lyse.AI</title>
  <meta name="description" content="Chatbot de démonstration Lyse.AI — mode test, non connecté à une IA.">
  <link href="https://framerusercontent.com/images/xqj43knJFaxRglWWhLGSw2vDEWw.png" rel="icon">
  <link rel="apple-touch-icon" href="https://framerusercontent.com/images/xqj43knJFaxRglWWhLGSw2vDEWw.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://lyse-ai-community.github.io/styles/chat.css">
</head>
<body>

  <header class="chat-header">
    <nav class="chat-nav">
      <a class="chat-logo" href="./index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c.6 2.8 1.6 3.8 4.4 4.4-2.8.6-3.8 1.6-4.4 4.4-.6-2.8-1.6-3.8-4.4-4.4C10.4 6.8 11.4 5.8 12 3z"></path>
          <path d="M18.5 14c.35 1.6.9 2.15 2.5 2.5-1.6.35-2.15.9-2.5 2.5-.35-1.6-.9-2.15-2.5-2.5 1.6-.35 2.15-.9 2.5-2.5z"></path>
        </svg>
        Lyse.AI
      </a>
      <a class="chat-navlink" href="./index.html#about">A propos</a>
      <a class="chat-navlink" href="./index.html#features">Fonctionnalités</a>
      <a class="chat-navlink" href="https://github.com/Juste1dev/Lyse.ai--LLM" target="_blank" rel="noopener">Github</a>
      <a class="chat-navlink" href="./index.html#faq">FAQ</a>
      <a class="chat-navlink cta" href="./index.html">Accueil</a>
    </nav>

    <button class="mode-badge" id="mode-pill" type="button" data-mode="test">
      <span class="mode-dot"></span>
      <span id="mode-label">Mode : TEST</span>
    </button>
  </header>

  <div class="chat-intro">
    <div class="eyebrow"><span class="dot"></span> Chat de démonstration</div>
    <h1 class="chat-title">Discutez avec <span class="dim">Lyse, pas encore branchée.</span></h1>
    <p class="chat-banner" id="env-banner">Chargement de la configuration…</p>
  </div>

  <main class="chat-shell">
    <div class="chat-messages" id="chat-messages"></div>

    <div class="chat-composer">
      <form id="composer-form">
        <div class="composer-card">
          <textarea
            id="composer-input"
            rows="1"
            placeholder="Écrivez votre prompt (question)…"
            autocomplete="off"
          ></textarea>
          <div class="composer-toolbar">
            <div class="composer-tools">
              <span class="tool-pill" title="À venir">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18"></path></svg>
                <span>Bibliothèque</span>
              </span>
              <button class="tool-icon" type="button" title="À venir" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5V7a2 2 0 0 0-2-2H8L4 9v10a2 2 0 0 0 2 2h6"></path><path d="M4 9h4V5"></path></svg>
              </button>
              <button class="tool-icon" type="button" title="À venir" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5-4 4-2-2-4 4"></path></svg>
              </button>
              <button class="tool-icon" type="button" title="À venir" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><path d="M12 18v4"></path></svg>
              </button>
            </div>
            <button class="send-btn" id="send-btn" type="submit">
              Envoyer
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="6 11 12 5 18 11"></polyline></svg>
            </button>
          </div>
        </div>
      </form>
      <div class="composer-hint">
        <span>Entrée pour envoyer · Maj + Entrée pour une nouvelle ligne</span>
        <button class="clear-btn" id="clear-btn" type="button">Effacer la conversation</button>
      </div>
    </div>
  </main>

  <script src="https://lyse-ai-community.github.io/scripts/modules/chat.js"></script>
</body>
</html>
